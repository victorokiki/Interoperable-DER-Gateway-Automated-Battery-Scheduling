[project]
name = "capstone"
version = "1.0.0"
description = "Interoperable DER Gateway for Automated Battery Scheduling — EMS Bridge middleware translating IEEE 2030.5 grid commands to Modbus TCP battery control."
authors = [
    {name = "Okikioluwa Olarewaju", email = "ovo2@sfu.ca"},
    {name = "Edward Amponsah", email = "eaa79@sfu.ca"},
    {name = "Emmanuel Kwesi Padi", email = "ekp6@sfu.ca"},
]
requires-python = ">=3.9"
dependencies = [
    "pymodbus==3.6.9",
    "aiohttp>=3.11.0",
    "flask==3.0.3",
]
dynamic = ["optional-dependencies"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capstone*"]

[tool.setuptools.dynamic]
optional-dependencies = {dev = {file = ["dev-requirements.txt"]}} # add packages for development in the dev-requirements.txt file

[project.scripts]
# TODO: add your CLI entry points here




